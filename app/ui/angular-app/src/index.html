<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SAM UI - Logical Apps</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#171717">
</head>
<body>
  <app-root>
    <!-- Instant Native Splash Screen (Replaced automatically when Angular initializes) -->
    <div id="sam-pwa-splash" style="
      position: fixed;
      inset: 0;
      background: #171717;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    ">
      <!-- Outer Pulsing Aura Around Logo -->
      <div style="position: relative; margin-bottom: 20px;">
        <div style="
          position: absolute;
          inset: -16px;
          background: radial-gradient(circle, rgba(168, 85, 247, 0.35) 0%, rgba(168, 85, 247, 0) 70%);
          border-radius: 50%;
          filter: blur(8px);
          animation: splash-aura-breathe 2s infinite ease-in-out;
        "></div>
        
        <!-- Logo Emblem Shield -->
        <div style="
          position: relative;
          width: 80px;
          height: 80px;
          border-radius: 50%;
          background: linear-gradient(135deg, #1e1e1e 0%, #0c0c0c 100%);
          border: 1px solid rgba(255, 255, 255, 0.08);
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        ">
          <!-- Central Glowing Core Orb -->
          <div style="
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #a855f7;
            box-shadow: 0 0 16px #a855f7, inset 0 0 8px rgba(255, 255, 255, 0.5);
            animation: splash-core-ping 1.6s infinite ease-in-out;
          "></div>
        </div>
      </div>
      
      <!-- SAM UI Typography -->
      <h2 style="
        color: #ffffff;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 0 0 6px 0;
        text-transform: uppercase;
        text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      ">SAM UI</h2>
      <p style="
        color: rgba(255, 255, 255, 0.35);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.15em;
        margin: 0;
        text-transform: uppercase;
      ">Logical Apps</p>
    </div>

    <!-- Self-contained Boot Keyframes -->
    <style>
      @keyframes splash-aura-breathe {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.35); opacity: 0.65; }
      }
      @keyframes splash-core-ping {
        0%, 100% { transform: scale(0.9); opacity: 0.9; box-shadow: 0 0 12px #a855f7; }
        50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 24px #a855f7; }
      }
    </style>
  </app-root>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('[PWA] Service Worker registered successfully:', reg.scope))
          .catch(err => console.error('[PWA] Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
